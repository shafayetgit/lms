services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lms-backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8001:8001"
    volumes:
      - ./backend/media:/backend/media
    networks:
      - erp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: lms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - erp-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: lms-celery-worker
    command: celery -A app.core.celery worker -l info
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/media:/backend/media
    networks:
      - erp-network

networks:
  erp-network:
    external: true